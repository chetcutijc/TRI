<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Training Dashboard</title>
  <style>
    :root { --accent: #5B6EF5; --ink: #1d1d2b; --muted: #7a7a8c; --line: #e3e3ea; --bg: #f6f6fa; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    .card { max-width: 360px; margin: 14vh auto 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
    h1 { font-size: 1.35rem; }
    p.sub { color: var(--muted); font-size: .9rem; margin: 6px 0 18px; line-height: 1.4; }
    input { width: 100%; padding: 11px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.link { background: none; color: var(--muted); font-weight: 400; text-decoration: underline; margin-top: 8px; padding: 6px; }
    #err { color: #c0392b; font-size: .85rem; min-height: 1.2em; margin-top: 10px; }
    #loading { text-align: center; color: var(--muted); margin-top: 30vh; font-size: .95rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="loading">Loading dashboard…</div>

  <div class="card" id="signin" hidden>
    <h1>Training Dashboard</h1>
    <p class="sub">Sign in with the same account as your wishlist and weight tracker.</p>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Sign in</button>
    <button class="link" id="forgot">Forgot password?</button>
    <div id="err"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // The dashboard itself is private: it lives in a private Supabase Storage bucket
    // that only your account can read. This public page signs you in, downloads the
    // latest build and shows it. Signing in to the wishlist on this site signs you in
    // here too (same account, same browser storage).
    const SUPABASE_URL = "https://tomzrvnvdywpffzjiesd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvbXpydm52ZHl3cGZmemppZXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjM3MDcsImV4cCI6MjEwNTIzOTcwN30.PAkvAX9JgMIQ821B3KvVu8E8ObQVBcQjw9323QOqwtY";
    const BUCKET = "tri";
    const $ = (id) => document.getElementById(id);
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Used by the dashboard's "Tell Your Coach" and race editor
    window.TRI_STORE = {
      async getJSON(name) {
        const { data, error } = await sb.storage.from(BUCKET).download("data/" + name);
        if (error) {
          if (/not found/i.test(error.message || "")) return null;
          throw new Error("Couldn't read " + name + ": " + error.message);
        }
        return JSON.parse(await data.text());
      },
      async putJSON(name, obj) {
        const body = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
        const { error } = await sb.storage.from(BUCKET).upload("data/" + name, body, { upsert: true, cacheControl: "0", contentType: "application/json" });
        if (error) throw new Error("Couldn't save " + name + ": " + error.message);
      },
      async signOut() { await sb.auth.signOut(); location.reload(); }
    };

    function showSignIn(msg) {
      $("loading").hidden = true;
      $("signin").hidden = false;
      $("err").textContent = msg || "";
    }

    let shown = false;
    async function showDashboard() {
      if (shown) return;
      shown = true;
      $("signin").hidden = true;
      $("loading").hidden = false;
      const { data, error } = await sb.storage.from(BUCKET).download("site/index.html");
      if (error) {
        shown = false;
        $("loading").textContent = /not found/i.test(error.message || "")
          ? "The dashboard hasn't been built into private storage yet. It appears after the next sync."
          : "Couldn't load the dashboard: " + error.message;
        return;
      }
      let html = await data.text();
      // Small sign-out link, added at the very end of the page
      html = html.replace(/<\/body>/i,
        '<p style="text-align:center;margin:24px 0 32px;font:13px -apple-system,sans-serif">' +
        '<a href="#" onclick="TRI_STORE.signOut();return false" style="color:#9a9aaa">Sign out</a></p></body>');
      // Replace this page with the dashboard. The window (and TRI_STORE) stays.
      document.open();
      document.write(html);
      document.close();
    }

    async function signIn() {
      $("err").textContent = "";
      const email = $("email").value.trim(), password = $("password").value;
      if (!email || !password) { $("err").textContent = "Enter your email and password."; return; }
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) $("err").textContent = error.message;
    }

    $("go").onclick = signIn;
    $("password").onkeydown = (e) => { if (e.key === "Enter") signIn(); };
    $("forgot").onclick = async () => {
      const email = $("email").value.trim();
      if (!email) { $("err").textContent = "Enter your email above first."; return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      $("err").textContent = error ? error.message : "Check your email for a reset link. Open it on this device.";
    };

    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        const pw = prompt("Choose a new password (at least 8 characters):");
        if (pw && pw.length >= 8) await sb.auth.updateUser({ password: pw });
      }
      if (session) showDashboard();
    });
    sb.auth.getSession().then(({ data: { session } }) => session ? showDashboard() : showSignIn());
  </script>
</body>
</html>
