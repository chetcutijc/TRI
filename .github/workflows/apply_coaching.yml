name: Apply AI Coaching Changes

on:
  workflow_dispatch:   # trigger manually from GitHub Actions tab

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply coaching changes to plan
        run: python scripts/apply_coaching.py

      - name: Rebuild dashboard with updated plan
        run: python scripts/build_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "garmin-bot"
          git config user.email "actions@github.com"
          git add data/plan_full.json data/ai_coaching.json \
                  docs/index.html docs/print.html docs/ai_coaching_adjustments.ics || true
          if ! git diff --quiet --cached; then
            git commit -m "Apply AI coaching changes: $(date -u +'%Y-%m-%d')"
            git pull origin main --no-rebase -X ours
            git push
          else
            echo "No changes to commit."
          fi
