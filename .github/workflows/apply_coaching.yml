name: Apply AI Coaching Changes

on:
  workflow_dispatch:   # trigger manually from GitHub Actions tab

# Shares the sync's group so the two never overwrite each other's bucket files
concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull private data from storage
        env:
          WT_SUPABASE_URL: https://tomzrvnvdywpffzjiesd.supabase.co
          WT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WT_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/tri_store.py pull

      - name: Apply coaching changes to plan
        run: python scripts/apply_coaching.py

      - name: Rebuild dashboard with updated plan
        run: python scripts/build_dashboard.py

      - name: Push private data and dashboard to storage
        env:
          WT_SUPABASE_URL: https://tomzrvnvdywpffzjiesd.supabase.co
          WT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WT_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/tri_store.py push
